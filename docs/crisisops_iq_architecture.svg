<svg width="1600" height="1050" viewBox="0 0 1600 1050" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061525"/>
      <stop offset="55%" stop-color="#082033"/>
      <stop offset="100%" stop-color="#0b3a5b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2742"/>
      <stop offset="100%" stop-color="#12395d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:46px;font-weight:800;fill:#ffffff}
      .subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:22px;fill:#cbd5e1}
      .section{font-family:Segoe UI,Arial,sans-serif;font-size:21px;font-weight:700;fill:#7dd3fc}
      .boxTitle{font-family:Segoe UI,Arial,sans-serif;font-size:22px;font-weight:800;fill:#ffffff}
      .boxText{font-family:Segoe UI,Arial,sans-serif;font-size:16px;fill:#dbeafe}
      .small{font-family:Segoe UI,Arial,sans-serif;font-size:14px;fill:#94a3b8}
      .pill{font-family:Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#061525}
      .box{fill:url(#card);stroke:#38bdf8;stroke-opacity:.38;stroke-width:1.5;rx:18;filter:url(#shadow)}
      .input{fill:#0b2a45;stroke:#38bdf8;stroke-opacity:.5;stroke-width:1.3;rx:16}
      .output{fill:#082033;stroke:#34d399;stroke-opacity:.7;stroke-width:1.5;rx:16;filter:url(#shadow)}
      .accent{fill:#38bdf8}
      .safe{fill:#34d399}
      .warn{fill:#fbbf24}
      .line{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrow);opacity:.9}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 8;fill:none;opacity:.65}
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg)"/>

  <circle cx="1450" cy="120" r="160" fill="#38bdf8" opacity=".08"/>
  <circle cx="180" cy="900" r="210" fill="#7dd3fc" opacity=".06"/>

  <text x="80" y="80" class="title">CrisisOps IQ Architecture</text>
  <text x="80" y="118" class="subtitle">Executive Crisis Intelligence Agent for Microsoft 365 Copilot + Foundry IQ Concept Layer</text>

  <rect x="1220" y="54" width="285" height="42" rx="21" fill="#38bdf8"/>
  <text x="1244" y="81" class="pill">Enterprise Agents Hackathon</text>

  <text x="80" y="175" class="section">Synthetic Enterprise Inputs</text>

  <rect x="80" y="205" width="260" height="92" class="input"/>
  <text x="110" y="240" class="boxTitle">Crisis Reports</text>
  <text x="110" y="268" class="boxText">Cases, status, impact</text>

  <rect x="80" y="322" width="260" height="92" class="input"/>
  <text x="110" y="357" class="boxTitle">Meeting Notes</text>
  <text x="110" y="385" class="boxText">Escalations, decisions</text>

  <rect x="80" y="439" width="260" height="92" class="input"/>
  <text x="110" y="474" class="boxTitle">Resources</text>
  <text x="110" y="502" class="boxText">Teams and capacity</text>

  <rect x="80" y="556" width="260" height="92" class="input"/>
  <text x="110" y="591" class="boxTitle">Policies</text>
  <text x="110" y="619" class="boxText">Rules and templates</text>

  <path d="M345 251 H440" class="line"/>
  <path d="M345 368 H440" class="line"/>
  <path d="M345 485 H440" class="line"/>
  <path d="M345 602 H440" class="line"/>

  <text x="450" y="175" class="section">Multi-Agent Reasoning Pipeline</text>

  <rect x="455" y="205" width="300" height="88" class="box"/>
  <text x="485" y="240" class="boxTitle">1. Intake Agent</text>
  <text x="485" y="268" class="boxText">Extract facts and crisis context</text>

  <rect x="455" y="325" width="300" height="88" class="box"/>
  <text x="485" y="360" class="boxTitle">2. Classifier Agent</text>
  <text x="485" y="388" class="boxText">Type, severity, affected parties</text>

  <rect x="455" y="445" width="300" height="88" class="box"/>
  <text x="485" y="480" class="boxTitle">3. Retrieval Agent</text>
  <text x="485" y="508" class="boxText">Policy-grounded knowledge retrieval</text>

  <rect x="455" y="565" width="300" height="88" class="box"/>
  <text x="485" y="600" class="boxTitle">4. Planner Agent</text>
  <text x="485" y="628" class="boxText">24-hour plan and priorities</text>

  <rect x="455" y="685" width="300" height="88" class="box"/>
  <text x="485" y="720" class="boxTitle">5. Compliance Agent</text>
  <text x="485" y="748" class="boxText">Risk, governance, approval review</text>

  <rect x="455" y="805" width="300" height="88" class="box"/>
  <text x="485" y="840" class="boxTitle">6. Communications Agent</text>
  <text x="485" y="868" class="boxText">Executive, customer, team drafts</text>

  <path d="M605 294 V320" class="line"/>
  <path d="M605 414 V440" class="line"/>
  <path d="M605 534 V560" class="line"/>
  <path d="M605 654 V680" class="line"/>
  <path d="M605 774 V800" class="line"/>

  <text x="845" y="175" class="section">Microsoft IQ + Governance Layer</text>

  <rect x="845" y="210" width="330" height="135" class="box"/>
  <text x="875" y="250" class="boxTitle">Foundry IQ Concept Layer</text>
  <text x="875" y="282" class="boxText">Crisis policies • Escalation rules</text>
  <text x="875" y="310" class="boxText">Communication templates • Playbooks</text>

  <rect x="845" y="385" width="330" height="120" class="box"/>
  <text x="875" y="425" class="boxTitle">Human Approval Gates</text>
  <text x="875" y="457" class="boxText">Public statements • Legal admissions</text>
  <text x="875" y="485" class="boxText">Regulatory notices • Compensation</text>

  <rect x="845" y="545" width="330" height="120" class="box"/>
  <text x="875" y="585" class="boxTitle">Audit Ledger</text>
  <text x="875" y="617" class="boxText">Reasoning • Policy reference</text>
  <text x="875" y="645" class="boxText">Risk level • Approval status • Time</text>

  <rect x="845" y="705" width="330" height="120" class="box"/>
  <text x="875" y="745" class="boxTitle">Verifier & Safety Agent</text>
  <text x="875" y="777" class="boxText">Checks explainability and safety</text>
  <text x="875" y="805" class="boxText">Prevents unapproved high-risk actions</text>

  <path d="M760 489 H840" class="line"/>
  <path d="M760 729 H840" class="line"/>
  <path d="M1010 350 V380" class="line"/>
  <path d="M1010 510 V540" class="line"/>
  <path d="M1010 670 V700" class="line"/>

  <text x="1230" y="175" class="section">Executive Outputs</text>

  <rect x="1230" y="210" width="300" height="548" class="output"/>
  <text x="1260" y="252" class="boxTitle">Executive Dashboard</text>

  <circle cx="1268" cy="298" r="6" class="accent"/>
  <text x="1285" y="304" class="boxText">Crisis Summary</text>

  <circle cx="1268" cy="338" r="6" class="accent"/>
  <text x="1285" y="344" class="boxText">Severity Score</text>

  <circle cx="1268" cy="378" r="6" class="accent"/>
  <text x="1285" y="384" class="boxText">Root Cause Analysis</text>

  <circle cx="1268" cy="418" r="6" class="accent"/>
  <text x="1285" y="424" class="boxText">Priority Ranking</text>

  <circle cx="1268" cy="458" r="6" class="accent"/>
  <text x="1285" y="464" class="boxText">24-Hour Action Plan</text>

  <circle cx="1268" cy="498" r="6" class="accent"/>
  <text x="1285" y="504" class="boxText">Resource Allocation</text>

  <circle cx="1268" cy="538" r="6" class="warn"/>
  <text x="1285" y="544" class="boxText">Compliance Review</text>

  <circle cx="1268" cy="578" r="6" class="warn"/>
  <text x="1285" y="584" class="boxText">Human Approval Gates</text>

  <circle cx="1268" cy="618" r="6" class="safe"/>
  <text x="1285" y="624" class="boxText">Stakeholder Communications</text>

  <circle cx="1268" cy="658" r="6" class="safe"/>
  <text x="1285" y="664" class="boxText">Audit Log</text>

  <rect x="1260" y="695" width="230" height="34" rx="17" fill="#34d399"/>
  <text x="1290" y="718" class="pill">Governed Response Plan</text>

  <path d="M1180 765 H1225" class="line"/>

  <rect x="80" y="925" width="1450" height="58" rx="18" fill="#020617" stroke="#38bdf8" stroke-opacity=".22"/>
  <text x="110" y="960" class="small">Safety notice: This demo uses synthetic or redacted data only. High-impact recommendations require human review and approval before execution.</text>
</svg>